name: custom test
run-name: custom test
on:
  workflow_dispatch:
    inputs:
      rng:
        description: Random number seed
        default: 7 # others that complete nearly as quick as 7 include 4, 5, 6, 8 and 11 (and 20257 is faster than 7)
      bars:
        description: Bars per phrase
        default: 4
jobs:
  Test-Run:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Compile
        run: make -C ${{ github.workspace }}/src
      - name: Run
        run: |
          cd ${{ github.workspace }}/src
          (echo ${{ inputs.rng }} ; echo ${{ inputs.bars }})|./clara&export M=$!; sleep 10;./clara&sleep 3;./clara&sleep 3;./clara&make install-lilypond-programs;wait $M
      - name: Convert output
        run: make -C ${{ github.workspace }}/src convert-all
      - name: Upload output
        uses: actions/upload-artifact@v7
        with:
          name: output
          path: |
            ${{ github.workspace }}/src/mvt-*.mwr
            ${{ github.workspace }}/src/mvt-*.ly
            ${{ github.workspace }}/src/mvt-*.pdf
            ${{ github.workspace }}/src/mvt-*.mid
            ${{ github.workspace }}/src/mvt-*.mp3
